name: Generate Plotly Figures

on:
  workflow_dispatch: # Allows manual trigger from your phone with one tap
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/generate.yml'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run generation script
        run: python generate_plotly.py

      - name: Commit and push generated HTML figures
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Auto-generate Plotly charts [skip ci]" || echo "No changes to commit"
          git push
