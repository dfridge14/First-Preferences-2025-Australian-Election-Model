name: Generate Plotly Figures

on:
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install numpy pandas plotly pyarrow scipy gdown

      - name: Download data from Google Drive
        run: gdown --folder "https://drive.google.com/drive/folders/1w5qSOsBBqakOVK2rNLXb6P-lOJhXDUEb" -O internal/

      - name: Remove 'Copy of ' strictly from file names
        run: |
          python -c "
          import os
          # Walk through the directory tree
          for root, dirs, files in os.walk('internal'):
              for file_name in files:
                  if 'Copy of ' in file_name:
                      old_path = os.path.join(root, file_name)
                      # Strip 'Copy of ' but keep the exact same folder location
                      new_name = file_name.replace('Copy of ', '')
                      new_path = os.path.join(root, new_name)
                      os.rename(old_path, new_path)
          "
          # Print the structure so you can see it succeeded in the logs
          ls -R internal/

      - name: Extract deterministic steps
        run: |
          SCRIPT_PATH=$(find internal -name "Simulate_Victorian_election_FPs.py" | head -n 1)
          SCRIPT_DIR=$(dirname "$SCRIPT_PATH")
          cd "$SCRIPT_DIR"
          python Simulate_Victorian_election_FPs.py
          mv deterministic_traces.pkl $GITHUB_WORKSPACE/

      - name: Generate HTML tables
        run: python generate_tables.py

      - name: Generate Plotly charts
        run: python generate_plotly.py

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ output_tables/ deterministic_traces.pkl
          git commit -m "Auto-generate charts and tables" || echo "No changes to commit"
          git push
          
