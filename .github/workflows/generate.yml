name: Generate Plotly Figures

on:
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install numpy pandas plotly pyarrow scipy gdown statsmodels

      - name: Download data from Google Drive
        run: gdown --folder "https://drive.google.com/drive/folders/1w5qSOsBBqakOVK2rNLXb6P-lOJhXDUEb" -O internal/

      - name: Fix Naming and Folder Structure
        run: |
          # 1. Clean the "Copy of" filenames
          find internal -type f -name "*Copy of *" | while read -r filepath; do
            dir=$(dirname "$filepath")
            base=$(basename "$filepath")
            newbase=${base//Copy of /}
            mv "$filepath" "$dir/$newbase"
          done
          
          # 2. THE FIX: Move VIC-2022 and VIC-2026 out of the subfolder so the script can see them!
          mv internal/Victorian\ election\ 2026\ data/* internal/ 2>/dev/null || true

      - name: Extract deterministic steps
        run: |
          cd internal
          python Simulate_Victorian_election_FPs.py
          mv deterministic_traces.pkl ../

      - name: Generate HTML tables
        run: python generate_tables.py

      - name: Generate Plotly charts
        run: python generate_plotly.py

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ output_tables/ deterministic_traces.pkl
          git commit -m "Auto-generate charts and tables" || echo "No changes to commit"
          git push
          
